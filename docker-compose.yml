# Docker Compose for ORNL PCINN Web Application
# Runs both the PCINN backend and Next.js frontend

version: '3.8'

services:
  # PCINN Backend (FastAPI + PyTorch)
  pcinn-backend:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: pcinn-backend
    ports:
      - "8000"
    volumes:
      - ./docker:/app
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Next.js Frontend (optional - can also run with npm)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ornl-web
    ports:
      - "3000:3000"
    environment:
      - FASTAPI_URL=http://pcinn-backend:8000
    depends_on:
      pcinn-backend:
        condition: service_healthy
    restart: unless-stopped
